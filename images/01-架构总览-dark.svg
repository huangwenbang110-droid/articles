<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 520" width="1360" height="1040" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
<title>Octopus 第一代监控平台架构</title>
<desc>采集与处理层为自研，传输、存储与指标展示使用开源组件。</desc>

<defs>
<linearGradient id="gBg" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#0A0B14"/>
<stop offset="45%" stop-color="#05060A"/>
<stop offset="100%" stop-color="#08060F"/>
</linearGradient>

<radialGradient id="gGlow" cx="50%" cy="30%" r="60%">
<stop offset="0%" stop-color="#7C3AED" stop-opacity="0.22"/>
<stop offset="55%" stop-color="#4C1D95" stop-opacity="0.08"/>
<stop offset="100%" stop-color="#000000" stop-opacity="0"/>
</radialGradient>

<radialGradient id="gGlow2" cx="50%" cy="85%" r="45%">
<stop offset="0%" stop-color="#22D3EE" stop-opacity="0.10"/>
<stop offset="100%" stop-color="#000000" stop-opacity="0"/>
</radialGradient>

<linearGradient id="gSelf" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#3B1580"/>
<stop offset="100%" stop-color="#1A0F3D"/>
</linearGradient>

<linearGradient id="gOss" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#1B2130"/>
<stop offset="100%" stop-color="#0E1219"/>
</linearGradient>

<linearGradient id="gFlow" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#A855F7"/>
<stop offset="100%" stop-color="#4C1D95"/>
</linearGradient>

<linearGradient id="gLine" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#6D28D9" stop-opacity="0.9"/>
<stop offset="100%" stop-color="#4B5563" stop-opacity="0.6"/>
</linearGradient>

<filter id="fGlow" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur in="SourceGraphic" stdDeviation="2.6" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<filter id="fSoft" x="-40%" y="-40%" width="180%" height="180%">
<feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="b"/>
<feMerge>
<feMergeNode in="b"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<pattern id="pGrid" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="0.7" fill="#1B2233"/>
</pattern>

<marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#A855F7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="520" fill="url(#gBg)"/>
<rect x="0" y="0" width="680" height="520" fill="url(#pGrid)"/>
<ellipse cx="340" cy="180" rx="330" ry="200" fill="url(#gGlow)"/>
<ellipse cx="340" cy="440" rx="280" ry="150" fill="url(#gGlow2)"/>

<text x="40" y="24" font-size="11" fill="#4B5563" letter-spacing="1.6">OCTOPUS · 2019–2020</text>

<rect x="424" y="16" width="13" height="13" rx="3" fill="url(#gSelf)" stroke="#A855F7" stroke-width="0.9" filter="url(#fSoft)"/>
<text x="443" y="23" font-size="12" fill="#C4B5FD" dominant-baseline="central">自研</text>
<rect x="512" y="16" width="13" height="13" rx="3" fill="url(#gOss)" stroke="#3E4A5C" stroke-width="0.9"/>
<text x="531" y="23" font-size="12" fill="#6B7280" dominant-baseline="central">开源</text>

<line x1="40" y1="52" x2="40" y2="508" stroke="#2A3242" stroke-width="1"/>
<circle cx="40" cy="46" r="2.5" fill="#A855F7" filter="url(#fSoft)"/>

<text x="52" y="46" font-size="11" fill="#6B7280" letter-spacing="0.8" dominant-baseline="central">采集</text>

<rect x="80" y="58" width="240" height="56" rx="10" fill="url(#gSelf)" stroke="#A855F7" stroke-width="1" filter="url(#fGlow)"/>
<rect x="80" y="58" width="3" height="56" rx="1.5" fill="#A855F7"/>
<text x="200" y="76" font-size="14" font-weight="500" fill="#EDE9FE" text-anchor="middle" dominant-baseline="central">Metrics SDK</text>
<text x="200" y="96" font-size="12" fill="#A78BFA" text-anchor="middle" dominant-baseline="central">JVM / 系统（OSHI）/ 业务指标</text>

<rect x="360" y="58" width="240" height="56" rx="10" fill="url(#gSelf)" stroke="#A855F7" stroke-width="1" filter="url(#fGlow)"/>
<rect x="360" y="58" width="3" height="56" rx="1.5" fill="#A855F7"/>
<text x="480" y="76" font-size="14" font-weight="500" fill="#EDE9FE" text-anchor="middle" dominant-baseline="central">Log SDK</text>
<text x="480" y="96" font-size="12" fill="#A78BFA" text-anchor="middle" dominant-baseline="central">继承 Appender · log4j / logback</text>

<path d="M200 114 L320 152" fill="none" stroke="url(#gLine)" stroke-width="1.8" marker-end="url(#arrP)"/>
<path d="M480 114 L360 152" fill="none" stroke="url(#gLine)" stroke-width="1.8" marker-end="url(#arrP)"/>

<text x="52" y="141" font-size="11" fill="#6B7280" letter-spacing="0.8" dominant-baseline="central">传输</text>

<rect x="240" y="152" width="200" height="48" rx="10" fill="url(#gOss)" stroke="#3E4A5C" stroke-width="1"/>
<text x="340" y="176" font-size="14" font-weight="500" fill="#B8C2CF" text-anchor="middle" dominant-baseline="central">Kafka</text>

<path d="M340 200 L340 234" fill="none" stroke="url(#gLine)" stroke-width="1.8" marker-end="url(#arrP)"/>

<text x="52" y="237" font-size="11" fill="#6B7280" letter-spacing="0.8" dominant-baseline="central">处理</text>

<rect x="60" y="248" width="180" height="56" rx="10" fill="url(#gSelf)" stroke="#A855F7" stroke-width="1" filter="url(#fGlow)"/>
<rect x="60" y="248" width="3" height="56" rx="1.5" fill="#A855F7"/>
<text x="152" y="268" font-size="13" font-weight="500" fill="#EDE9FE" text-anchor="middle" dominant-baseline="central">预聚合 · Mouth</text>
<text x="152" y="288" font-size="12" fill="#A78BFA" text-anchor="middle" dominant-baseline="central">写入存储</text>

<rect x="250" y="248" width="180" height="56" rx="10" fill="url(#gSelf)" stroke="#A855F7" stroke-width="1" filter="url(#fGlow)"/>
<rect x="250" y="248" width="3" height="56" rx="1.5" fill="#A855F7"/>
<text x="342" y="268" font-size="13" font-weight="500" fill="#EDE9FE" text-anchor="middle" dominant-baseline="central">Eye · Alarm</text>
<text x="342" y="288" font-size="12" fill="#A78BFA" text-anchor="middle" dominant-baseline="central">指标告警 / 日志告警</text>

<rect x="440" y="248" width="180" height="56" rx="10" fill="url(#gSelf)" stroke="#A855F7" stroke-width="1" filter="url(#fGlow)"/>
<rect x="440" y="248" width="3" height="56" rx="1.5" fill="#A855F7"/>
<text x="532" y="268" font-size="13" font-weight="500" fill="#EDE9FE" text-anchor="middle" dominant-baseline="central">Logterminator</text>
<text x="532" y="288" font-size="12" fill="#A78BFA" text-anchor="middle" dominant-baseline="central">日志字段提取</text>

<path d="M340 304 L340 338" fill="none" stroke="url(#gLine)" stroke-width="1.8" marker-end="url(#arrG)"/>

<text x="52" y="341" font-size="11" fill="#6B7280" letter-spacing="0.8" dominant-baseline="central">存储</text>

<rect x="60" y="352" width="180" height="56" rx="10" fill="url(#gOss)" stroke="#3E4A5C" stroke-width="1"/>
<text x="150" y="372" font-size="13" font-weight="500" fill="#B8C2CF" text-anchor="middle" dominant-baseline="central">ElasticSearch</text>
<text x="150" y="392" font-size="12" fill="#6B7280" text-anchor="middle" dominant-baseline="central">指标实时 + 日志</text>

<rect x="250" y="352" width="180" height="56" rx="10" fill="url(#gOss)" stroke="#3E4A5C" stroke-width="1"/>
<text x="340" y="372" font-size="13" font-weight="500" fill="#B8C2CF" text-anchor="middle" dominant-baseline="central">OpenTSDB</text>
<text x="340" y="392" font-size="12" fill="#6B7280" text-anchor="middle" dominant-baseline="central">指标（与 ES 双写）</text>

<rect x="440" y="352" width="180" height="56" rx="10" fill="url(#gOss)" stroke="#3E4A5C" stroke-width="1"/>
<text x="530" y="372" font-size="13" font-weight="500" fill="#B8C2CF" text-anchor="middle" dominant-baseline="central">HDFS</text>
<text x="530" y="392" font-size="12" fill="#6B7280" text-anchor="middle" dominant-baseline="central">指标离线</text>

<path d="M340 408 L340 442" fill="none" stroke="url(#gLine)" stroke-width="1.8" marker-end="url(#arrG)"/>

<text x="52" y="445" font-size="11" fill="#6B7280" letter-spacing="0.8" dominant-baseline="central">展示</text>

<rect x="120" y="456" width="200" height="52" rx="10" fill="url(#gOss)" stroke="#3E4A5C" stroke-width="1"/>
<text x="220" y="473" font-size="13" font-weight="500" fill="#B8C2CF" text-anchor="middle" dominant-baseline="central">Grafana</text>
<text x="220" y="492" font-size="12" fill="#6B7280" text-anchor="middle" dominant-baseline="central">指标看板</text>

<rect x="360" y="456" width="200" height="52" rx="10" fill="url(#gSelf)" stroke="#A855F7" stroke-width="1" filter="url(#fGlow)"/>
<rect x="360" y="456" width="3" height="52" rx="1.5" fill="#A855F7"/>
<text x="462" y="473" font-size="13" font-weight="500" fill="#EDE9FE" text-anchor="middle" dominant-baseline="central">Octopus Web</text>
<text x="462" y="492" font-size="12" fill="#A78BFA" text-anchor="middle" dominant-baseline="central">日志 · 配置 · 告警管理</text>
</svg>
