<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 520" width="680" height="520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
<title>Octopus 第一代监控平台架构</title>
<desc>采集与处理层为自研，传输、存储与指标展示使用开源组件。</desc>
<rect x="0" y="0" width="680" height="520" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="440" y="16" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="458" y="22" font-size="12" fill="#3C3489" dominant-baseline="central">自研</text>
<rect x="516" y="16" width="12" height="12" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="534" y="22" font-size="12" fill="#444441" dominant-baseline="central">开源</text>

<text x="40" y="46" font-size="12" fill="#5F5E5A" dominant-baseline="central">采集</text>

<rect x="80" y="58" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="200" y="76" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Metrics SDK</text>
<text x="200" y="96" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">JVM / 系统（OSHI）/ 业务指标</text>

<rect x="360" y="58" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="480" y="76" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Log SDK</text>
<text x="480" y="96" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">继承 Appender · log4j / logback</text>

<path d="M200 114 L320 152" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M480 114 L360 152" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="40" y="141" font-size="12" fill="#5F5E5A" dominant-baseline="central">传输</text>

<rect x="240" y="152" width="200" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="176" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">Kafka</text>

<path d="M340 200 L340 234" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="40" y="237" font-size="12" fill="#5F5E5A" dominant-baseline="central">处理</text>

<rect x="60" y="248" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="150" y="268" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">预聚合 · Mouth</text>
<text x="150" y="288" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">写入存储</text>

<rect x="250" y="248" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="268" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Eye · Alarm</text>
<text x="340" y="288" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">指标告警 / 日志告警</text>

<rect x="440" y="248" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="530" y="268" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Logterminator</text>
<text x="530" y="288" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">日志字段提取</text>

<path d="M340 304 L340 338" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="40" y="341" font-size="12" fill="#5F5E5A" dominant-baseline="central">存储</text>

<rect x="60" y="352" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="150" y="372" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">ElasticSearch</text>
<text x="150" y="392" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">指标实时 + 日志</text>

<rect x="250" y="352" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="372" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">OpenTSDB</text>
<text x="340" y="392" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">指标（与 ES 双写）</text>

<rect x="440" y="352" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="530" y="372" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">HDFS</text>
<text x="530" y="392" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">指标离线</text>

<path d="M340 408 L340 442" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="40" y="445" font-size="12" fill="#5F5E5A" dominant-baseline="central">展示</text>

<rect x="120" y="456" width="200" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="220" y="473" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">Grafana</text>
<text x="220" y="492" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">指标看板</text>

<rect x="360" y="456" width="200" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="460" y="473" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Octopus Web</text>
<text x="460" y="492" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">日志 · 配置 · 告警管理</text>
</svg>
